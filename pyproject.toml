[tool.poetry]
name = "guiguts"
version = "2.1.7"
description = "Guiguts version 2, Python/tkinter version"
authors = ["DP Guiguts Dev Team <windymilla@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "guiguts", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
Pillow = "^12.3"
pywin32 = {version = ">=312,<313", platform = "win32"}
roman = "^5.2"
regex = "^2026.9"
levenshtein = "^0.27"
requests = "^2.34"
ttkthemes = "^3.3"
darkdetect = "^0.8"
rapidfuzz = "^3.14"
packaging = "^26.3"
lxml = "^6.1"
tinycss = "^0.4"
cssselect = "^1.6"
html5lib = "^1.1"

[tool.poetry.group.dev.dependencies]
black = "^26.10"
flake8 = "^7.4"
Sphinx = "^8.2" # Version 9.1 requires Python >= 3.12
pytest = "^9.1"
mypy = "^2.4"
pylint = "^4.1"
beautifulsoup4 = "^4.15"
types-regex = "^2026.9"
types-requests = "^2.33"
types-lxml = "^2026.2"
types-ttkthemes = "^3.3"
build = "^1.6"

[tool.poetry.scripts]
guiguts = "guiguts.application:main"

[tool.pylint]
disable = [
  "duplicate-code",
  "raw-checker-failed",
  "bad-inline-option",
  "locally-disabled",
  "file-ignored",
  "suppressed-message",
  "useless-suppression",
  "deprecated-pragma",
  "use-symbolic-message-instead",
  "line-too-long",
  "logging-fstring-interpolation",
  "logging-not-lazy",
  "too-few-public-methods",
  "too-many-ancestors",
  "too-many-public-methods",
  "too-many-statements",
  "too-many-instance-attributes",
  "too-many-locals",
  "too-many-arguments",
  "too-many-positional-arguments",
  "too-many-return-statements",
  "too-many-lines",
  "too-many-branches",
  "too-many-nested-blocks",
  "global-statement"
]
enable = ["c-extension-no-member"]
extension-pkg-allow-list = ["unicodedataplus", "lxml.etree"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
